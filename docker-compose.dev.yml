version: '3.8'

services:
  # CBT Application (Development)
  cbt-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbt-app-dev
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=mongodb://mongo:27017
      - DATABASE_HOST=mongo
      - DATABASE_PORT=27017
      - DATABASE_NAME=cbt_dev
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev-jwt-secret-key-change-in-production
      - BIOMETRIC_ENCRYPTION_KEY=dev-biometric-key-32-bytes-long
      - SECRET_KEY=dev-secret-key-for-session-management
      - RANDOMISATION_SECRET=dev-randomisation-secret-change-me
      - DEBUG=true
      - ENVIRONMENT=development
      - RELOAD=true
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./static:/app/static
    networks:
      - cbt-dev-network
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "cbt.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  mongo:
    image: mongo:7
    container_name: cbt-mongo-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - cbt-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Development)
  redis:
    image: redis:7-alpine
    container_name: cbt-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - cbt-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MongoDB admin UI (optional; profile: tools)
  mongo-express:
    image: mongo-express:1
    container_name: cbt-mongo-express
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    ports:
      - "8082:8081"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - cbt-dev-network
    restart: unless-stopped
    profiles:
      - tools

  # Redis Commander (Development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cbt-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - cbt-dev-network
    restart: unless-stopped
    profiles:
      - tools

volumes:
  mongo_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  cbt-dev-network:
    driver: bridge
